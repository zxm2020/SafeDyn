[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safedyn-vln-guard-method"
version = "0.1.0"
description = "SafeDyn-VLN Guard: Method-only runtime authorization for VLN"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["safedyn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v -q"
